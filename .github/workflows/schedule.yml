name: Scheduled Daily Check
on:
  schedule:
    - cron: '0 9 * * *'

concurrency:
  group: schedule-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_HOME: ${{ github.workspace }}/.cargo-cache
  npm_config_cache: ${{ github.workspace }}/.npm-cache
  PACKAGER: "Turann_ (turannul) <turanull000@gmail.com>"
  REPO_NAME: "turann-s-place"

jobs:
  check_for_updates:
    runs-on: ubuntu-latest
    container: archlinux:base
    outputs:
      packages: ${{ steps.set-matrix.outputs.packages }}
      has_packages: ${{ steps.set-matrix.outputs.has_packages }}
    steps:
      - name: Install detection dependencies
        run: pacman -Sy --noconfirm --needed git jq base-devel

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create non-root user
        run: |
          useradd -m turannul
          chown -R turannul:turannul .
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache KaiT2en-Fedora git repo
        run: |
          git clone --mirror https://github.com/kaiT2en/KaiT2en-Fedora.git /tmp/KaiT2en-Fedora.git
          chmod -R a+rX /tmp/KaiT2en-Fedora.git
          git config --system url."/tmp/KaiT2en-Fedora.git".insteadOf "https://github.com/kaiT2en/KaiT2en-Fedora.git"
          git config --system url."/tmp/KaiT2en-Fedora.git".insteadOf "https://github.com/kaiT2en/KaiT2en-Fedora"

      - name: Determine packages to build
        id: set-matrix
        run: bash .github/workflow_scripts/detect_schedule.sh

  build:
    needs: check_for_updates
    if: needs.check_for_updates.outputs.has_packages == 'true'
    runs-on: ubuntu-latest
    container: archlinux:base
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.check_for_updates.outputs.packages) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install dependencies for ${{ matrix.package }}
        run: bash .github/workflow_scripts/install_deps.sh "${{ matrix.package }}"

      - name: Create non-root user
        run: |
          useradd -m turannul
          mkdir -p "$CARGO_HOME" "$npm_config_cache"
          chown -R turannul:turannul "$CARGO_HOME" "$npm_config_cache"
          chown -R turannul:turannul .
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build ${{ matrix.package }}
        run: su -p turannul -c "cd ${{ matrix.package }} && makepkg --nodeps --force"

      - name: Upload ${{ matrix.package }} artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.package }}
          path: |
            ${{ matrix.package }}/*.pkg.tar.zst
            ${{ matrix.package }}/PKGBUILD
          if-no-files-found: error

  prepare_repo:
    needs: [check_for_updates, build]
    if: "!cancelled() && needs.check_for_updates.outputs.has_packages == 'true'"
    runs-on: ubuntu-latest
    container: archlinux:base
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Install git and pacman tools
        run: pacman -Sy --noconfirm --needed git base-devel

      - name: Checkout main repo
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Download built packages and updated PKGBUILDs
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Update repository and installed_files.txt
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_NAME: ${{ env.REPO_NAME }}
        run: bash .github/workflow_scripts/update_repo.sh
