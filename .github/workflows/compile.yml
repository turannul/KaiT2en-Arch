name: compile
on:
  push:
  pull_request:
  workflow_dispatch:
env:
  CARGO_HOME: ${{ github.workspace }}/work/.cargo-cache
  npm_config_cache: ${{ github.workspace }}/work/.npm-cache
  PACKAGER: "Turann_ <turanull000@gmail.com>"
jobs:
  all:
    runs-on: ubuntu-latest
    container: archlinux:base
    timeout-minutes: 180
    steps:
      - name: Install dependencies
        run: pacman -Sy --noconfirm --needed base-devel git rust npm nodejs python cargo gtk4 libadwaita glib2 glib2-devel gcc-libs pango cairo librsvg libdrm fprintd libfprint pipewire pipewire-audio pipewire-pulse wireplumber lsp-plugins-lv2 alsa-ucm-conf systemd python-gobject polkit bc cpio curl kmod msr-tools pciutils rsync brightnessctl cava
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: work/KaiT2en-Arch
          fetch-depth: 1
      - name: Create non-root user
        run: |
          useradd -m turannul
          chown -R turannul:turannul work/
      - name: Build hid_t2magicmouse-dkms
        run: su -p turannul -c "cd work/KaiT2en-Arch/hid_t2magicmouse-dkms && makepkg -df"
      - name: Build t2bce-dkms
        run: su -p turannul -c "cd work/KaiT2en-Arch/t2bce-dkms && makepkg -df"
      - name: Build t2bdrm-dkms
        run: su -p turannul -c "cd work/KaiT2en-Arch/t2bdrm-dkms && makepkg -df"
      - name: Build t2gmux-dkms
        run: su -p turannul -c "cd work/KaiT2en-Arch/t2gmux-dkms && makepkg -df"
      - name: Build t2mfi_fastcharge-dkms
        run: su -p turannul -c "cd work/KaiT2en-Arch/t2mfi_fastcharge-dkms && makepkg -df"
      - name: Build t2touchbar-dkms
        run: su -p turannul -c "cd work/KaiT2en-Arch/t2touchbar-dkms && makepkg -df"
      - name: Build t2smc-dkms
        run: su -p turannul -c "cd work/KaiT2en-Arch/t2smc-dkms && makepkg -df"
      - name: Build t2smp-dkms
        run: su -p turannul -c "cd work/KaiT2en-Arch/t2smp-dkms && makepkg -df"
      - name: Build t2thunderbolt-dkms
        run: su -p turannul -c "cd work/KaiT2en-Arch/t2thunderbolt-dkms && makepkg -df"
      - name: Build t2sep-dkms
        run: su -p turannul -c "cd work/KaiT2en-Arch/t2sep-dkms && makepkg -df"
      - name: Build t2_precision_trackpad-dkms
        run: su -p turannul -c "cd work/KaiT2en-Arch/t2_precision_trackpad-dkms && makepkg -df"
      - name: Build t2_trackpad_actuator-dkms
        run: su -p turannul -c "cd work/KaiT2en-Arch/t2_trackpad_actuator-dkms && makepkg -df"
      - name: Build assets
        run: su -p turannul -c "cd work/KaiT2en-Arch/kait2en-assets && makepkg -df"
      - name: Build t2-fan-control
        run: su -p turannul -c "cd work/KaiT2en-Arch/t2-fan-control && makepkg -df"
      - name: Build t2-force-click
        run: su -p turannul -c "cd work/KaiT2en-Arch/t2-force-click && makepkg -df"
      - name: Build t2-smc-control
        run: su -p turannul -c "cd work/KaiT2en-Arch/t2-smc-control && makepkg -df"
      - name: Build t2-journal
        run: su -p turannul -c "cd work/KaiT2en-Arch/t2-journal && makepkg -df"
      - name: Build t2-power-tune
        run: su -p turannul -c "cd work/KaiT2en-Arch/t2-power-tune && makepkg -df"
      - name: Build t2-power-explorer
        run: su -p turannul -c "cd work/KaiT2en-Arch/t2-power-explorer && makepkg -df"
      - name: Build t2-touchid
        run: su -p turannul -c "cd work/KaiT2en-Arch/t2-touchid && makepkg -df"
      - name: Build t2-cpu-control
        run: su -p turannul -c "cd work/KaiT2en-Arch/t2-cpu-control && makepkg -df"
      - name: Build t2-dgpu-control
        run: su -p turannul -c "cd work/KaiT2en-Arch/t2-dgpu-control && makepkg -df"
      - name: Build t2-hybrid-gpu-control
        run: su -p turannul -c "cd work/KaiT2en-Arch/t2-hybrid-gpu-control && makepkg -df"
      - name: Build t2-services
        run: su -p turannul -c "cd work/KaiT2en-Arch/t2-services && makepkg -df"
      - name: Build t2-ave
        run: su -p turannul -c "cd work/KaiT2en-Arch/t2-ave && makepkg -df"
      - name: Build DSP
        run: su -p turannul -c "cd work/KaiT2en-Arch/t2bce_audio-dsp && makepkg -df"
      - name: Build kait2en-apps-meta
        run: su -p turannul -c "cd work/KaiT2en-Arch/kait2en-apps-meta && makepkg -df"
      - name: Build kait2en-modules-meta
        run: su -p turannul -c "cd work/KaiT2en-Arch/kait2en-modules-meta && makepkg -df"
      - name: Build react-drm
        run: su -p turannul -c "cd work/KaiT2en-Arch/react-drm && makepkg -df"
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: work/KaiT2en-Arch/*/*.pkg.tar.zst
          if-no-files-found: error
